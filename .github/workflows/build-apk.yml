name: 构建 APK

on:
  push:
  workflow_dispatch:      # 也可以在 Actions 页面手动点一下就构建

permissions:
  contents: write         # 允许把 APK 发布到 Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 准备 Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: 编译
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: 整理产物
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/EnglishReader.apk
          ls -lh out

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: EnglishReader-APK
          path: out/EnglishReader.apk
          retention-days: 30

      - name: 发布到 Releases（手机上可直接下载）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y 2>/dev/null || true
          gh release create latest out/EnglishReader.apk \
            --title "最新版 APK" \
            --notes "手机浏览器打开本页，点下面的 EnglishReader.apk 下载安装即可。"
